<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kofar Arziki</title>
</head>

<body>

<div class="card" id="dashboard" style="display:none;">

<h2>⭐ Kofar Arziki Dashboard</h2>

<h3 id="welcomeUser">👤 Welcome User</h3>

<div class="card">
<h3>💰 Main Balance</h3>
<p id="userBalance">₦0</p>
</div>

<div class="card">
<h3>🎁 Earnings</h3>

<button onclick="task()">
📋 Daily Task (+₦100)
</button>

<button onclick="referral()">
👥 Referral Bonus (+₦200)
</button>

</div>

<div class="card">
<h3>💳 Wallet</h3>

<button onclick="deposit()">
💰 Deposit
</button>

<button onclick="withdraw()">
🏧 Withdraw
</button>

</div>

<div class="card">
<h3>👥 Customer Section</h3>

<input type="text"
id="customerName"
placeholder="Customer Name">

<input type="text"
id="customerWhatsapp"
placeholder="WhatsApp Number">

<button onclick="addCustomer()">
➕ Add Customer
</button>

<p id="customerList">
No Customer Yet
</p>

</div>

<div class="card">
<h3>📜 Transaction History</h3>

<p id="history">
No transaction yet
</p>

</div>

<div class="card">
<h3>📞 Support</h3>

<p>WhatsApp Support</p>

<p>Contact Admin</p>

</div>

<button onclick="logout()">
🚪 Logout
</button>

</div>
