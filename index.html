<script>.

function register(){

let user =
document.getElementById("newUsername").value;

let pass =
document.getElementById("newPassword").value;

if(user=="" || pass==""){

alert("Cika Username da Password");

return;

}

localStorage.setItem("username", user);

localStorage.setItem("password", pass);

alert("Account Created Successfully ✅");

}


<div class="card" id="loginBox">

<h2>🔑 Login</h2>

<input type="text"
id="username"
placeholder="Username">

<input type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<script>
function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

let savedUser =
localStorage.getItem("username");

let savedPass =
localStorage.getItem("password");

if(user===savedUser && pass===savedPass){

alert("An shiga lafiya ✅");

document.getElementById("registerBox").style.display="none";

document.getElementById("loginBox").style.display="none";

document.getElementById("dashboard").style.display="block";

}else{

alert("Username ko Password ba dai-dai bane ❌");

}

}

<div class="card">

<h3>💰 Account Balance</h3>

<p id="userBalance">₦0</p>

</div>
<style>.

#userBalance{
font-size:30px;

}

<button onclick="deposit()">
💳 Deposit
</button>
<script>

function deposit(){

document.getElementById("history").innerHTML =
"💳 Deposit ₦" + amount;
let amount =
prompt("Shigar adadin kudin Deposit");

if(amount==null || amount==""){
return;
}

let balance =
Number(localStorage.getItem("balance")) || 0;

balance += Number(amount);

localStorage.setItem("balance", balance);

document.getElementById("userBalance").innerHTML =
"₦" + balance;

alert("Deposit Successful ✅");

}

<button onclick="withdraw()">
🏧 Withdraw
</button>
<script>

function withdraw(){

document.getElementById("history").innerHTML =
"🏧 Withdraw ₦" + amount;
let amount =
prompt("Shigar adadin kudin Withdraw");

if(amount==null || amount==""){
return;
}

let balance =
Number(localStorage.getItem("balance")) || 0;

if(balance >= Number(amount)){

balance -= Number(amount);

localStorage.setItem("balance", balance);

document.getElementById("userBalance").innerHTML =
"₦" + balance;

alert("Withdraw Successful ✅");

}else{

alert("Balance bai isa ba ❌");

}

}
