<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kofar Arziki</title>

<style>
body{
background:#000;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:0;
}

.header{
background:#111;
padding:20px;
text-align:center;
border-bottom:3px solid lime;
}

.header h1{
color:lime;
}

.card{
background:#111;
margin:15px;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin:8px 0;
border:none;
border-radius:10px;
background:lime;
font-weight:bold;
}

#dashboard{
display:none;
}

#userBalance{
font-size:30px;
font-weight:bold;
color:lime;
}
</style>
</head>

<body>

<div class="header">
<h1>Kofar Arziki</h1>
</div>

<div class="card" id="loginBox">
<h2>Login</h2>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<div class="card" id="dashboard">
<h2>⭐ Kofar Arziki Dashboard</h2>

<h3>💰 Account Balance</h3>
<p id="userBalance">₦0</p>

<h3>👤 User Panel</h3>

<button onclick="deposit()">💳 Deposit</button>
<button onclick="withdraw()">🏧 Withdraw</button>
<button onclick="referral()">👥 Referral</button>
<button onclick="task()">📋 Daily Task</button>
<button onclick="balance()">💰 Check Balance</button>
<button onclick="logout()">🚪 Logout</button>

</div>

<script>
function login(){
document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";
}

function deposit(){
alert("Deposit system yana aiki");
}

function withdraw(){
alert("Withdraw request sent");
}

function referral(){
alert("Referral link copied");
}

function task(){
alert("Daily Task Completed");
}

function balance(){
alert("Balance: ₦0");
}

function logout(){
document.getElementById("dashboard").style.display="none";
document.getElementById("loginBox").style.display="block";
}
</script>

</body>
</html>
