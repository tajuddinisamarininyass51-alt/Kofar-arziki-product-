<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kofar Arziki</title>

<style>

body{
background:#000;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:0;
}

</style>

</head>

<body>
<div class="header">

<img src="logo.png" alt="Kofar Arziki Logo">

<h1>💚 Kofar Arziki 💚</h1>

<p>Kofar Samun Dama da Arziki</p>

</div>
<style>

.header{
background:#111;
padding:20px;
text-align:center;
border-bottom:3px solid lime;
}

.header img{
width:150px;
border-radius:20px;
margin-bottom:10px;
}

.header h1{
color:lime;
font-size:35px;
margin:5px;
}

.header p{
color:white;
font-size:16px;
}
<style>
<div class="card" id="registerBox">

<h2>📝 Create Account</h2>

<input type="text"
id="newUsername"
placeholder="Create Username">

<input type="password"
id="newPassword"
placeholder="Create Password">

<button onclick="register()">
Register
</button>

</div>
 <style>

.card{
background:#111;
margin:15px;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
background:lime;
color:black;
font-weight:bold;
}
<script>

function register(){

let user =
document.getElementById("newUsername").value;

let pass =
document.getElementById("newPassword").value;

if(user=="" || pass==""){

alert("Cika Username da Password");

return;

}

localStorage.setItem("username", user);

localStorage.setItem("password", pass);

alert("Account Created Successfully ✅");

}

<div class="card" id="loginBox">

<h2>🔑 Login</h2>
