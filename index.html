<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kofar Arziki</title>

<style>

body{
background:#000;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:0;
}

</style>

</head>

<body>
<div class="header">

<img src="logo.png" alt="Kofar Arziki Logo">

<h1>💚 Kofar Arziki 💚</h1>

<p>Kofar Samun Dama da Arziki</p>

</div>
<style>

.header{
background:#111;
padding:20px;
text-align:center;
border-bottom:3px solid lime;
}

.header img{
width:150px;
border-radius:20px;
margin-bottom:10px;
}

.header h1{
color:lime;
font-size:35px;
margin:5px;
}

.header p{
color:white;
font-size:16px;
}
<style>
<div class="card" id="registerBox">

<h2>📝 Create Account</h2>

<input type="text"
id="newUsername"
placeholder="Create Username">

<input type="password"
id="newPassword"
placeholder="Create Password">

<button onclick="register()">
Register
</button>

</div>
 <style>

.card{
background:#111;
margin:15px;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
background:lime;
color:black;
font-weight:bold;
}
<script>

function register(){

let user =
document.getElementById("newUsername").value;

let pass =
document.getElementById("newPassword").value;

if(user=="" || pass==""){

alert("Cika Username da Password");

return;

}

localStorage.setItem("username", user);

localStorage.setItem("password", pass);

alert("Account Created Successfully ✅");

}

<div class="card" id="loginBox">

<h2>🔑 Login</h2>

<input type="text"
id="username"
placeholder="Username">

<input type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

let savedUser =
localStorage.getItem("username");

let savedPass =
localStorage.getItem("password");

if(user===savedUser && pass===savedPass){

alert("An shiga lafiya ✅");

document.getElementById("registerBox").style.display="none";

document.getElementById("loginBox").style.display="none";

document.getElementById("dashboard").style.display="block";

}else{

alert("Username ko Password ba dai-dai bane ❌");

}

}


<div class="card"
id="dashboard"
style="display:none;">

<h2>⭐ Kofar Arziki Dashboard</h2>

<p>Maraba da zuwa Dashboard</p>

</div>
<h2>⭐ Kofar Arziki Dashboard</h2>

<h3 id="welcomeUser">
👤 Welcome User
</h3>

<p>Maraba da zuwa Dashboard</p>
document.getElementById("dashboard").style.display="block";

document.getElementById("welcomeUser").innerHTML =
"👤 " + user;
<h3 id="welcomeUser">
👤 Welcome User
</h3>

<div class="card">

<h3>💰 Main Balance</h3>

<p id="userBalance">₦0</p>

</div>
<style>

#userBalance{
font-size:30px;
font-weight:bold;
color:lime;
text-align:center;
}
document.getElementById("welcomeUser").innerHTML =
"👤 " + user;

let balance =
localStorage.getItem("balance") || 0;

document.getElementById("userBalance").innerHTML =
"₦" + balance;
 
<button onclick="deposit()">
💳 Deposit
</button>
<script>
document.getElementById("history").innerHTML =
"💳 Deposit ₦" + amount;
function deposit(){

let amount =
prompt("Shigar adadin kudin Deposit");

if(amount=="" || amount==null){

return;

}

let balance =
Number(localStorage.getItem("balance")) || 0;

balance += Number(amount);

localStorage.setItem("balance", balance);

document.getElementById("userBalance").innerHTML =
"₦" + balance;

alert("Deposit Successful ✅");

}

<button onclick="withdraw()">
🏧 Withdraw
</button>
<script>

document.getElementById("history").innerHTML =
"🏧 Withdraw ₦" + amount;
 
function withdraw(){

let amount =
prompt("Shigar adadin kudin Withdraw");

if(amount=="" || amount==null){

return;

}

let balance =
Number(localStorage.getItem("balance")) || 0;

if(balance >= Number(amount)){

balance -= Number(amount);

localStorage.setItem("balance", balance);

document.getElementById("userBalance").innerHTML =
"₦" + balance;

alert("Withdraw Successful ✅");

}else{

alert("Balance bai isa ba ❌");

}

}

<button onclick="referral()">
👥 Referral Bonus
</button>

<script>

document.getElementById("history").innerHTML =
"👥 Referral Bonus +₦200";

function referral(){

let balance =
Number(localStorage.getItem("balance")) || 0;

balance += 200;

localStorage.setItem("balance", balance);

document.getElementById("userBalance").innerHTML =
"₦" + balance;

alert("Referral Bonus +₦200 ✅");

}

<button onclick="task()">
📋 Daily Task (+₦100)
</button>
<script>

document.getElementById("history").innerHTML =
"📋 Daily Task Bonus +₦100";
function task(){

let balance =
Number(localStorage.getItem("balance")) || 0;

balance += 100;

localStorage.setItem("balance", balance);

document.getElementById("userBalance").innerHTML =
"₦" + balance;

alert("Daily Task Bonus +₦100 ✅");

}

<div class="card">

<h3>📜 Transaction History</h3>

<p id="history">
No transaction yet
</p>

</div>

<div class="card">

<h3>👥 Customer Section</h3>

<input type="text"
id="customerName"
placeholder="Customer Name">

<input type="text"
id="customerWhatsapp"
placeholder="WhatsApp Number">

<button onclick="addCustomer()">
➕ Add Customer
</button>

<p id="customerList">
No Customer Yet
</p>

</div>
<script>

function addCustomer(){

let name =
document.getElementById("customerName").value;

let whatsapp =
document.getElementById("customerWhatsapp").value;

if(name=="" || whatsapp==""){

alert("Cika Customer Name da WhatsApp Number");

return;

}

document.getElementById("customerList").innerHTML +=

"<br>👤 " + name +

" | 📱 " + whatsapp;

alert("Customer Added Successfully ✅");

}

<button onclick="logout()">
🚪 Logout
</button>
<script>

function logout(){

document.getElementById("dashboard").style.display =
"none";

document.getElementById("registerBox").style.display =
"block";

document.getElementById("loginBox").style.display =
"block";

alert("An fita daga account ✅");

}
</body>
 <footer>
<p>💚 Kofar Arziki © 2026</p>
<p>Kofar Samun Dama da Arziki</p>
</footer>

<style>
footer{
background:#111;
padding:20px;
text-align:center;
color:lime;

}
</style>

</body>
</html>
