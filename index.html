<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kofar Arziki</title>

<style>
body{
background:#000;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:0;
}

.header{
background:#111;
padding:20px;
text-align:center;
border-bottom:3px solid lime;
}

.header h1{
color:lime;
font-size:35px;
}

.card{
background:#111;
margin:15px;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin:8px 0;
border:none;
border-radius:10px;
background:lime;
color:black;
font-weight:bold;
font-size:16px;
}

#dashboard{
display:none;
}

#userBalance{
font-size:30px;
font-weight:bold;
color:lime;
text-align:center;
}
</style>
</head>

<body>

<div class="header">
<h1>💚 Kofar Arziki 💚</h1>
</div>

<div class="card" id="registerBox">

<h2>Create Account</h2>

<input type="text" id="newUsername" placeholder="Create Username">

<input type="password" id="newPassword" placeholder="Create Password">

<button onclick="register()">Register</button>

</div>

<div class="card" id="loginBox">

<h2>Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<div class="card" id="dashboard">

<h2>⭐ Dashboard</h2>

<p id="userBalance">₦0</p>

<button onclick="deposit()">💳 Deposit</button>

<button onclick="withdraw()">🏧 Withdraw</button>

<button onclick="referral()">👥 Referral</button>

<button onclick="task()">📋 Daily Task</button>

<button onclick="balance()">💰 Check Balance</button>

<button onclick="logout()">🚪 Logout</button>

</div>

<script>

function register(){

var newUser =
document.getElementById("newUsername").value;

var newPass =
document.getElementById("newPassword").value;

if(newUser=="" || newPass==""){
alert("Cika Username da Password");
return;
}

localStorage.setItem("username", newUser);
localStorage.setItem("password", newPass);

alert("Account Created Successfully");

}

function login(){

var user =
document.getElementById("username").value;

var pass =
document.getElementById("password").value;

var savedUser =
localStorage.getItem("username");

var savedPass =
localStorage.getItem("password");

if(user==savedUser && pass==savedPass){

document.getElementById("registerBox").style.display="none";

document.getElementById("loginBox").style.display="none";

document.getElementById("dashboard").style.display="block";

alert("An shiga lafiya");

}else{

alert("Username ko Password ba dai-dai bane");

}

}

function deposit(){
alert("Deposit System");
}

function withdraw(){
alert("Withdraw System");
}

function referral(){
alert("Referral Link");
}

function task(){
alert("Daily Task Completed");
}

function balance(){
alert("Balance: ₦0");
}

function logout(){

document.getElementById("dashboard").style.display="none";

document.getElementById("registerBox").style.display="block";

document.getElementById("loginBox").style.display="block";

}

<footer>

<p>💚 Kofar Arziki © 2026</p>

<p>Kofar Samun Dama da Arziki</p>

</footer>

</script>

</body>
</html>
