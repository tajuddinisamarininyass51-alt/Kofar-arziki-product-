<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kofar Arziki</title>

<style>
body{
    margin:0;
    padding:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    background:#111;
    padding:20px;
    text-align:center;
    border-bottom:3px solid lime;
}

.header h1{
    color:lime;
    margin:0;
}

.card{
    background:#111;
    margin:15px;
    padding:20px;
    border-radius:15px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    background:lime;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#dashboard{
    display:none;
}

#userBalance{
    font-size:30px;
    color:lime;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
<h1>Kofar Arziki</h1>
</div>

<div class="card" id="loginBox">

<h2>Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<div class="card" id="dashboard">

<h2>⭐ Kofar Arziki Dashboard</h2>

<div class="card">
<h3>💰 Account Balance</h3>
<p id="userBalance">₦0</p>
</div>

<div class="card">
<h3>👤 User Panel</h3>

<button onclick="deposit()">💳 Deposit</button>

<button onclick="withdraw()">🏧 Withdraw</button>

<button onclick="referral()">👥 Referral</button>

<button onclick="task()">📋 Daily Task</button>

<button onclick="balance()">💰 Check Balance</button>

<button onclick="logout()">🚪 Logout</button>

</div>

</div>

</div>

<script>

function deposit(){
alert("Deposit system yana aiki");
}

function withdraw(){
alert("Withdraw request sent");
}

function referral(){
alert("Referral link copied");
}

function task(){
alert("Daily Task Completed");
}

function balance(){
alert("Balance: ₦0");
}

function logout(){
document.getElementById("dashboard").style.display="none";
document.getElementById("loginBox").style.display="block";
}

</script>
</div>

<script>

function deposit(){
alert("Deposit system yana aiki");
}

function withdraw(){
alert("Withdraw request sent");
}

function referral(){
alert("Referral link copied");
}

function task(){
alert("Daily Task Completed");
}

function balance(){
alert("Balance: ₦0");
}

function logout(){
document.getElementById("dashboard").style.display="none";
document.getElementById("loginBox").style.display="block";
}

</script>

</body>
</html>

<input type="text" id="newUsername" placeholder="Create Username">

<input type="password" id="newPassword" placeholder="Create Password">

<button onclick="register()">Register</button>

</div>

<div class="card" id="loginBox">

<h2>Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>
