<head>

}

<style>

.card{

margin:15px;
padding:20px;

}

input{
width:100%;

border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
background:lime;
color:black;

}

<script>
<div class="card" id="registerBox">

<h2>📝 Create Account</h2>

<input type="text"
id="newUsername"
placeholder="Create Username">

<input type="password"
id="newPassword"

Register
</button>

</div>
